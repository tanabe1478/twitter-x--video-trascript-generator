[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "twitter-x-video-transcript-generator"
version = "0.1.0"
description = "Generate and translate transcripts from X/Twitter videos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "imageio-ffmpeg>=0.6.0",
  "mlx-whisper>=0.4.3",
  "yt-dlp>=2026.8.19",
]

[project.scripts]
x-video-transcript = "x_video_transcript.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/x_video_transcript"]
